<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada — Eude Ribeiro</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FAFAFA" />
  <link rel="icon" id="error-favicon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" id="error-styles" href="/styles.css" />
  <script>
    /* O 404 do GitHub Pages é servido na URL quebrada. Este bloco garante que
       os arquivos funcionem tanto em domínio próprio (raiz) quanto em
       usuario.github.io/repositorio. */
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var isProjectPage = /\.github\.io$/i.test(location.hostname) && parts.length > 0;
      var base = isProjectPage ? "/" + parts[0] + "/" : "/";
      window.ERROR_BASE = base;
      if (base !== "/") {
        document.getElementById("error-styles").href = base + "styles.css";
        document.getElementById("error-favicon").href = base + "assets/favicon.svg";
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <header class="error-header">
    <a href="/" data-home aria-label="Eude Ribeiro — início">
      <img src="/assets/logo-eude-horizontal.svg" data-asset="assets/logo-eude-horizontal.svg" alt="Eude Ribeiro" width="461" height="135" />
    </a>
    <a href="/" data-home>Voltar ao início ↗</a>
  </header>

  <main class="error-page" id="main">
    <div class="error-card">
      <span class="tag">Erro 404</span>
      <div class="error-code" aria-hidden="true">404</div>
      <h1>Essa página saiu de cena.</h1>
      <p>O endereço não existe ou foi movido. Mas o portfólio continua aqui — com trabalhos, serviços e contato.</p>
      <div class="error-actions">
        <a class="btn btn--dark" href="/" data-home>Voltar ao início <span aria-hidden="true">↗</span></a>
        <a class="btn btn--ghost" href="mailto:eudejoviano@gmail.com">Falar comigo</a>
      </div>
      <div class="error-brand">
        <img src="/assets/logo-eude-stacked.svg" data-asset="assets/logo-eude-stacked.svg" alt="Eude Ribeiro" width="288" height="157" />
      </div>
    </div>
  </main>

  <script>
    (function () {
      var base = window.ERROR_BASE || "/";
      document.querySelectorAll("[data-home]").forEach(function (link) {
        link.setAttribute("href", base);
      });
      if (base !== "/") {
        document.querySelectorAll("[data-asset]").forEach(function (img) {
          img.setAttribute("src", base + img.getAttribute("data-asset"));
        });
      }
    })();
  </script>
</body>
</html>
